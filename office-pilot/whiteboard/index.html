<!doctype html>
<html data-protected lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#191c27"><link rel="icon" href="data:,"><link rel="stylesheet" href="./full.css"><title>Office walkthrough | POD Research Institute</title></head>
<body><main id="viewer"><canvas id="scene" tabindex="0" aria-label="Office walkthrough. Use the arrow keys or WASD to move. Drag to look around."></canvas>
<section id="plan" class="glass"><button id="mapToggle" aria-expanded="false" aria-controls="planBody">Floor plan <span aria-hidden="true">⌄</span></button><div id="planBody" hidden><canvas id="floorMap" width="326" height="348" aria-label="Office floor plan. Select a point to walk there."></canvas><div id="places" aria-label="Choose a destination"></div><button id="stop" hidden>Stop walking</button></div></section>
<div id="place" class="glass">Connecting corridor</div>
<div id="moves" class="glass" aria-label="Movement controls"><button aria-label="Move forward" data-key="w">↑</button><button aria-label="Step left" data-key="a">←</button><button aria-label="Step back" data-key="s">↓</button><button aria-label="Step right" data-key="d">→</button></div>
<div id="hint" class="glass">Drag to look · Tap to walk</div><a id="proof" class="glass" href="./office-review.html#full-proof">Compare renders ↗</a>
<div id="loading" role="status"><div class="load-panel"><span id="status">Opening the office…</span><progress aria-label="Loading progress" max="100" value="4"></progress><button id="retry" hidden>Try again</button></div></div></main>
<script type="module" src="./office.js?v=hotel-15b"></script></body></html>
