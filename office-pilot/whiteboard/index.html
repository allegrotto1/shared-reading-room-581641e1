<!doctype html>
<html data-protected lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#191c27"><link rel="icon" href="data:,"><link rel="stylesheet" href="./full.css"><title>POD 研究所 · 辦公室漫遊</title></head>
<body><main id="viewer"><canvas id="scene" tabindex="0" aria-label="辦公室漫遊。用方向鍵移動，拖曳轉頭"></canvas>
<section id="plan" class="glass"><button id="mapToggle" aria-expanded="false" aria-controls="planBody">平面導覽 <span aria-hidden="true">⌄</span></button><div id="planBody" hidden><canvas id="floorMap" width="326" height="348" aria-label="辦公室平面圖，點按可步行位置"></canvas><div id="places" aria-label="選擇步行目的地"></div><button id="stop" hidden>停止行走</button></div></section>
<div id="place" class="glass">連接通道</div>
<div id="moves" class="glass" aria-label="行走"><button aria-label="向前行" data-key="w">↑</button><button aria-label="向左橫移" data-key="a">←</button><button aria-label="退後" data-key="s">↓</button><button aria-label="向右橫移" data-key="d">→</button></div>
<div id="hint" class="glass">拖曳環視 · 點地面行走</div><a id="proof" class="glass" href="./office-review.html">實測對照 ↗</a>
<div id="loading" role="status"><div class="load-panel"><span id="status">正在開啟辦公室</span><progress aria-label="載入進度" max="100" value="4"></progress><button id="retry" hidden>重新載入</button></div></div></main>
<script type="module" src="./office.js"></script></body></html>
