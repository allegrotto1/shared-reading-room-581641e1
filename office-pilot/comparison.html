<!doctype html><html lang="zh-Hant" data-research-studio><head><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>入口盆栽與會議室窗景 · POD</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3f0;color:#27232c;font:16px/1.65 system-ui,'Microsoft JhengHei',sans-serif}header,main{max-width:1180px;margin:auto;padding:32px 4.5%}header{border-bottom:1px solid #d5ced7}header p{font-size:.72rem;letter-spacing:.12em;color:#6b4d6d;margin:30px 0 0}h1{font-size:clamp(2rem,4vw,3.7rem);line-height:1.2;margin:.24em 0 .52em}h2{font-size:1.55rem}section{margin:0 0 3rem}a{color:#66346b}nav{display:flex;gap:1.4em}.pair{display:flex;gap:12px;margin:1.1rem 0;align-items:stretch}.pair figure{flex:1;min-width:0;background:#ebe7e3;margin:0}.pair img{display:block;width:100%;height:clamp(180px,29vw,315px);object-fit:contain}.pair figcaption{padding:8px 12px;font-size:.83rem;color:#4d444f}.error{padding:2em;color:#853e35}p{max-width:86ch}@media(max-width:650px){.pair{display:grid;grid-template-columns:1fr}.pair img{height:auto;max-height:390px}.pair figcaption{font-size:.93rem}header,main{padding:20px}} #plant .pair:nth-of-type(-n+2) img{height:clamp(330px,42vw,550px)}</style></head><body><div id="story"></div><script type="module">import{enterPilot,mediaLocation,readMedia}from'./pilot/media.js?rev=garden10b';async function openReview(){
if(!await enterPilot())return;const res=await readMedia('./review/story.html');if(!res.ok)throw Error('story');document.getElementById('story').innerHTML=await res.text();
const work=[...document.querySelectorAll('[data-photo]')];let pos=0,releases=[];await Promise.all(Array.from({length:3},async()=>{while(pos<work.length){const el=work[pos++];try{const a=await mediaLocation('./review/'+el.dataset.photo);releases.push(a.release);el.src=a.url;}catch{el.after(document.createTextNode('相片未能載入，請重新整理。'));}}}));addEventListener('pagehide',()=>releases.forEach(r=>r()),{once:true});}openReview().catch(()=>{document.getElementById('story').textContent='對照頁未能載入，請重新整理。';});</script></body></html>
