<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>香港大型活動票務與旅客留宿｜Research Studio</title><style>html{color-scheme:dark;--ink:#e6efed;--paper:#111b1b;--muted:#b5c9c3;--line:#475f59;--card:#192625}*{box-sizing:border-box}body{margin:0;background:#101919;color:#edf3f0;font:16px/1.65 system-ui,"Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button,summary{cursor:pointer}a{color:#a4e2d0}#ticketShareCopy{min-height:44px;padding:.5rem .7rem;border:1px solid #76978c;color:#ddf6e9;background:#1a332b;border-radius:5px}#ticketShareStatus{display:block;font-size:.85rem}#reportTicketDatabase{margin:1rem 0;padding:.85rem;border:1px solid #71998c;border-radius:5px;max-width:100%;min-width:0}#reportTicketDatabase>summary{font-weight:700;min-height:32px}#reportPriceHost,#reportPriceHost .tk-content{min-width:0;max-width:100%}#reportPriceHost .tk-content{padding:0}#ticketResearch [hidden]{display:none!important}@media print{#ticketShareCopy,#ticketShareStatus,#reportTicketDatabase{display:none!important}}</style><main style="max-width:40rem;margin:15vh auto;padding:1.4rem"><h1>香港大型活動票務與旅客留宿</h1><p id="read-status" role="status">請用這項票務研究的完整分享連結開啟。</p></main><script>(async()=>{
 const status=document.getElementById('read-status');
 const route=new URLSearchParams(location.hash.slice(1)),keyText=route.get('key');
 if(!keyText)return;
 try{
 const bytes=s=>Uint8Array.from(atob(s.replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0));
 const key=await crypto.subtle.importKey('raw',bytes(keyText),'AES-GCM',false,['decrypt']);
 status.textContent='正在開啟票務研究…';
 const response=await fetch('reader.enc.json',{cache:'no-store'});if(!response.ok)throw Error('reader');
 const p=await response.json(),zipped=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(p.iv)},key,bytes(p.data));
 const html=await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 route.set('view','tickets');if(!route.has('ticketSection'))route.set('ticketSection','report');
 history.replaceState(null,'',location.pathname+location.search+'#'+route);
 document.open();document.write(html);document.close();
 }catch{status.textContent='無法開啟。請使用「複製本研究分享連結」取得的完整網址。';}
 })();</script></html>
